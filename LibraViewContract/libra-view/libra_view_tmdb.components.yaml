components:
  schemas:
    GenreDTO:
      type: object
      required:
        - id
        - tmdbId
        - name
      properties:
        id:
          type: integer
          format: int64
        tmdbId:
          type: integer
          format: int64
        name:
          type: string
    BaseCinematicDTO:
      type: object
      required:
        - id
        - tmdbId
        - title
      properties:
        id:
          type: integer
          format: int64
        tmdbId:
          type: integer
          format: int64
        title:
          type: string
        releaseDate:
          type: string
          format: date-time
        overview:
          type: string
        posterPath:
          type: string
        backdropPath:
          type: string
        voteAverage:
          type: integer
          format: double
        voteCount:
          type: integer
          format: int32
        popularity:
          type: integer
          format: double
        genreIds:
          type: array
          items:
            type: integer
            format: int64
    MovieDTO:
      allOf:
        - $ref: "#/components/schemas/BaseCinematicDTO"
        - type: object
          required:
            - discriminator
          properties:
            discriminator:
              type: string
              example: movie
    SeriesDTO:
      allOf:
        - $ref: "#/components/schemas/BaseCinematicDTO"
        - type: object
          required:
            - discriminator
          properties:
            discriminator:
              type: string
              example: series
    CinematicDTO:
      type: object
      required:
        - discriminator
      properties:
         discriminator:
           type: string
      discriminator:
        propertyName: discriminator
        mapping:
          movie: '#/components/schemas/MovieDTO'
          series: '#/components/schemas/SeriesDTO'
      anyOf:
        - $ref: '#/components/schemas/MovieDTO'
        - $ref: '#/components/schemas/SeriesDTO'