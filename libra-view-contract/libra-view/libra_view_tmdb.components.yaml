components:
  schemas:
    CinematicType:
      type: string
      enum: [MOVIE, SERIES]

    GenreDTO:
      type: object
      required:
        - id
        - tmdbId
        - name
      properties:
        id:
          type: integer
          format: int64
        tmdbId:
          type: integer
          format: int64
        name:
          type: string
    CinematicDTO:
      type: object
      required:
        - discriminator
        - id
        - tmdbId
        - title
      properties:
        discriminator:
          type: string
        id:
          type: integer
          format: int64
        tmdbId:
          type: integer
          format: int64
        title:
          type: string
        releaseDate:
          type: string
          format: date-time
        overview:
          type: string
        posterPath:
          type: string
        backdropPath:
          type: string
        voteAverage:
          type: integer
          format: double
        voteCount:
          type: integer
          format: int32
        popularity:
          type: integer
          format: double
        genreIds:
          type: array
          items:
            type: integer
            format: int64
      discriminator:
        propertyName: discriminator
        mapping:
          movie: '#/components/schemas/MovieDTO'
          series: '#/components/schemas/SeriesDTO'
    MovieDTO:
      allOf:
        - $ref: "#/components/schemas/CinematicDTO"
    SeriesDTO:
      allOf:
        - $ref: "#/components/schemas/CinematicDTO"