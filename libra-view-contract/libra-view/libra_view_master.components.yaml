components:
  schemas:
    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string
    AuthNResponse:
      type: object
      required:
        - token
        - expiration
      properties:
        token:
          type: string
          format: jwt
        expiration:
          type: number
          format: int64