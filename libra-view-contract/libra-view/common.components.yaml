components:
  schemas:
    PageableRequest:
      type: object
      required:
        - page
        - size
      properties:
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        filters:
          type: array
          items:
            $ref: "#/components/schemas/FilterDescriptor"
    FilterDescriptor:
      type: object
      required:
        - field
        - value
      properties:
        field:
          type: string
        value:
          type: string
    PageableResponse:
      type: object
        required:
          - page
          - results
          - totalPages
          - totalResults
        properties:
          page:
            type:
        results?: Array<SearchTv200ResponseResultsInner>;
        total_pages?: number;
        total_results?: number;
        TODO
    IdData:
      type: integer
      format: int64
    IdArrayData:
      type: array
      items:
        $ref: "#/components/schemas/IdData"
