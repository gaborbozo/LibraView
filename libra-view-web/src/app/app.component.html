<mat-toolbar class="flex-0">
  <button mat-icon-button [toggleDrawer]="drawer">
    <mat-icon>menu</mat-icon>
  </button>
  <span>LibraView</span>
</mat-toolbar>
<mat-drawer-container [hasBackdrop]="true" class="flex-1">
  <mat-drawer #drawer [mode]="'over'">
    <div class="height-100 px-1 flex-col gap-16">
      <h5 [routerLink]="['/cinematic']">Cinematics</h5>
      <button
        mat-raised-button
        [routerLink]="['/cinematic/search']"
        [toggleDrawer]="drawer">
        Search
      </button>
      <button
        mat-raised-button
        [routerLink]="['/cinematic/library']"
        [toggleDrawer]="drawer">
        Library
      </button>
      <div class="mt-auto flex-col gap-16">
        @if (authenticationService.isLoggedIn()) {
          <button
            mat-raised-button
            [routerLink]="['/settings']">
            Settings
          </button>
        }
        <!-- TODO: Consider refactoring LibraAuthenticationService by adding a ReplaySubject to keep the current user's information updated and avoid querying it on every frame -->
        @if (authenticationService.isLoggedIn()) {
          <button
            mat-raised-button
            (click)="authenticationService.logout()">
            Logout
          </button>
        }
      </div>
    </div>
  </mat-drawer>
  <mat-drawer-content class="libra-main-content">
    <router-outlet />
  </mat-drawer-content>
</mat-drawer-container>
