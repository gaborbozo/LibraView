<form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex-row flex-wrap gap-16">
  <div>
    <mat-button-toggle-group formControlName="type" [hideSingleSelectionIndicator]="true">
      <mat-button-toggle [value]="CinematicType.Movie">Movie</mat-button-toggle>
      <mat-button-toggle [value]="CinematicType.Series">Series</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
  <mat-form-field>
    <mat-label>Title</mat-label>
    <input matInput formControlName="title" />
  </mat-form-field>
</form>
@if (searchResponse) {
  <div class="flex-row flex-wrap gap-16">
    @for (item of searchResponse.response.results; track item.id) {
      <app-cinematic-card
        [searchItem]="{type: searchResponse.mode, item: item}"
      ></app-cinematic-card>
    }
  </div>
  <mat-paginator [length]="searchResponse.response.total_results"
                 [pageSize]="searchResponse.response.results?.length"
                 [pageSizeOptions]="[searchResponse.response.results?.length!]"
                 (page)="onSubmit($event)">
  </mat-paginator>
}
